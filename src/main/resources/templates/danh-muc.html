<section th:fragment="noiDung" th:if="${!laTrangChu and trongDanhMuc}" id="danh-sach" class="category-page">
  <h1 th:text="${loai == 'dien-thoai' ? 'Điện thoại' : (loai == 'laptop' ? 'Laptop' : (loai == 'tai-nghe' ? 'Tai nghe' : (loai == 'chuot-ban-phim' ? 'Chuột và bàn phím' : 'Phụ kiện')))}">Danh mục</h1>
  <div class="category-brands" aria-label="Chọn thương hiệu"><a th:href="@{/san-pham(loai=${loai})}" th:classappend="${loc.hang == '' ? 'selected' : ''}">Tất cả</a><a th:each="h:${thuongHieu}" th:href="@{/san-pham(loai=${loai},hang=${h.DuongDan})}" th:classappend="${loc.hang == h.DuongDan ? 'selected' : ''}" th:attr="data-brand=${h.DuongDan}"><img th:if="${#strings.contains('|apple|samsung|oppo|xiaomi|honor|vivo|asus|acer|dell|hp|lenovo|sony|razer|jbl|', '|' + h.DuongDan + '|')}" th:src="@{/media/brands/{slug}.svg(slug=${h.DuongDan})}" alt="" aria-hidden="true" width="28" height="28"><span th:classappend="${h.DuongDan == 'sony' ? 'visually-hidden' : ''}" th:text="${h.TenThuongHieu}"></span></a></div>
  <form action="/san-pham" method="get" th:object="${loc}" class="category-filter-form"><input type="hidden" name="loai" th:value="${loai}"><input type="hidden" name="hang" th:value="${loc.hang}"><input type="hidden" name="q" th:value="${loc.q}">
    <div class="category-filter-top"><div><strong>Bộ lọc</strong><span th:text="${ketQua.tong} + ' kết quả'"></span></div><label for="category-sort">Sắp xếp <select id="category-sort" th:field="*{sapXep}"><option value="mac-dinh">Theo khuyến nghị</option><option value="moi-nhat">Mới nhất</option><option value="pho-bien">Phổ biến nhất</option><option value="gia-giam">Giá: cao đến thấp</option><option value="gia-tang">Giá: thấp đến cao</option></select></label></div>
    <div class="category-filter-row">
      <details class="filter-popover"><summary>Khoảng giá</summary><div class="price-filter" data-price-filter><div class="price-values"><label>Giá từ (₫)<input type="number" min="0" max="50000000" step="1" inputmode="numeric" placeholder="0" th:field="*{giaTu}"></label><label>Giá đến (₫)<input type="number" min="0" max="50000000" step="1" inputmode="numeric" placeholder="Không giới hạn" th:field="*{giaDen}"></label></div><div class="price-track" data-price-track hidden><span class="price-track-fill"></span><input type="range" data-range-min aria-label="Giá thấp nhất"><input type="range" data-range-max aria-label="Giá cao nhất"></div><div class="price-scale" data-price-scale hidden><span>0 ₫</span><span>50.000.000 ₫+</span></div><button type="submit">Áp dụng</button></div></details>
      <details class="filter-popover" th:if="${loai=='dien-thoai' or loai=='laptop'}"><summary>Bộ nhớ</summary><div><label>RAM tối thiểu<select th:field="*{ram}"><option value="">Tất cả</option><option th:each="v:${ {4,8,12,16,24,32,64} }" th:value="${v}" th:text="${v}+' GB'"></option></select></label><label>Dung lượng tối thiểu<select th:field="*{luuTru}"><option value="">Tất cả</option><option th:each="v:${ {128,256,512,1024,2048} }" th:value="${v}" th:text="${v}+' GB'"></option></select></label><button type="submit">Áp dụng</button></div></details>
      <details class="filter-popover" th:if="${!dongSanPham.isEmpty()}"><summary>Dòng sản phẩm</summary><div><label for="category-line">Chọn dòng</label><select id="category-line" name="dong"><option value="">Tất cả</option><option th:each="d:${dongSanPham}" th:if="${loc.hang == '' or loc.hang == d.DuongDanThuongHieu}" th:value="${d.MaDongSanPham}" th:selected="${boSung.dong==d.MaDongSanPham}" th:text="${d.TenThuongHieu+' · '+d.TenDongSanPham}"></option></select><button type="submit">Áp dụng</button></div></details>
      <details class="filter-popover" th:each="a:${thuocTinhLoc}"><summary th:text="${a.TenThuocTinh}"></summary><div><label th:for="${'cat-attr-'+a.MaThuocTinh}" th:text="${a.TenThuocTinh}"></label><select th:if="${a.KieuDuLieu=='CO_KHONG'}" th:id="${'cat-attr-'+a.MaThuocTinh}" th:name="${'tt.'+a.MaThuocTinh}"><option value="">Tất cả</option><option value="true" th:selected="${boSung.thuocTinh[a.MaThuocTinh]=='true'}">Có</option><option value="false" th:selected="${boSung.thuocTinh[a.MaThuocTinh]=='false'}">Không</option></select><select th:if="${a.KieuDuLieu=='CHU' and giaTriLoc.containsKey(a.MaThuocTinh)}" th:id="${'cat-attr-'+a.MaThuocTinh}" th:name="${'tt.'+a.MaThuocTinh}"><option value="">Tất cả</option><option th:each="v:${giaTriLoc[a.MaThuocTinh]}" th:value="${v}" th:text="${v}" th:selected="${boSung.thuocTinh[a.MaThuocTinh]==v}"></option></select><input th:if="${a.KieuDuLieu!='CO_KHONG' and (a.KieuDuLieu!='CHU' or !giaTriLoc.containsKey(a.MaThuocTinh))}" th:id="${'cat-attr-'+a.MaThuocTinh}" th:name="${'tt.'+a.MaThuocTinh}" th:value="${boSung.thuocTinh[a.MaThuocTinh]}" th:type="${a.KieuDuLieu=='SO'?'number':'text'}" step="any"><button type="submit">Áp dụng</button></div></details>
      <label class="category-stock"><input type="checkbox" th:field="*{conHang}"> Còn hàng</label><button type="submit" class="category-apply">Áp dụng</button><a th:href="@{/san-pham(loai=${loai})}">Xóa lọc</a>
    </div><div class="alert alert-danger" role="alert" th:if="${!loiLoc.isEmpty()}"><p th:each="e:${loiLoc}" th:text="${e}"></p></div>
  </form>
  <div class="category-grid"><article class="category-card" th:each="sp:${sanPham}" data-category-card><a class="category-image" th:href="@{/san-pham/{slug}(slug=${sp.duongDan},sku=${sp.maSkuGoiY})}" data-card-link><img th:if="${sp.anhDaiDien!=null}" th:src="${sp.anhDaiDien}" th:alt="${sp.tenSanPham}" data-card-image loading="lazy"><span th:if="${sp.anhDaiDien==null}">Ảnh đang cập nhật</span></a><a class="category-card-title" th:href="@{/san-pham/{slug}(slug=${sp.duongDan},sku=${sp.maSkuGoiY})}" data-card-link th:text="${sp.tenSanPham}"></a><div class="category-colors" data-card-colors aria-label="Chọn màu"></div><div class="category-variants" aria-label="Chọn cấu hình"><button type="button" th:each="v:${bienTheDanhMuc[sp.maSanPham]}" data-card-variant th:attr="data-id=${v.MaBienThe},data-color=${v.MauSac},data-image=${v.anh},data-price=${v.GiaHieuLuc},data-ram=${v.DungLuongRam},data-storage=${v.DungLuongLuuTru},data-cpu=${v.BoXuLy},data-link=@{/san-pham/{slug}(slug=${sp.duongDan},sku=${v.MaBienThe})},aria-pressed=${v.MaBienThe==sp.maSkuGoiY?'true':'false'}" th:text="${v.TenBienThe}"></button></div><p class="category-spec" data-card-spec></p><p class="category-price" data-card-price th:text="${#numbers.formatDecimal(sp.giaTu,0,'POINT',0,'COMMA')}+' ₫'"></p></article></div>
  <div class="empty" th:if="${#lists.isEmpty(sanPham)}"><h2>Chưa tìm thấy sản phẩm phù hợp</h2><p>Hãy thử thay đổi bộ lọc.</p><a th:href="@{/san-pham(loai=${loai})}">Xóa bộ lọc</a></div><nav class="catalog-pagination" aria-label="Phân trang sản phẩm" th:if="${ketQua.soTrang()>1}"><a th:if="${ketQua.trang>1}" th:href="${linkTruoc}" rel="prev">Trang trước</a><span th:text="'Trang '+${ketQua.trang}+' / '+${ketQua.soTrang()}"></span><a th:if="${ketQua.trang<ketQua.soTrang()}" th:href="${linkSau}" rel="next">Trang tiếp</a></nav>
</section>
