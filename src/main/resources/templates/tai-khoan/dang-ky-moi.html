<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{dung-chung :: head('Tạo tài khoản')}"></head><body><header th:replace="~{dung-chung :: header}"></header><main id="noi-dung" class="auth-panel auth-redesign"><svg class="auth-symbol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-8 8-8s8 3 8 8"/></svg><h1>Tạo tài khoản KAIASTORE</h1><p>Lưu sản phẩm yêu thích và theo dõi đơn hàng của bạn.</p><p>Đã có tài khoản? <a href="/login">Đăng nhập</a></p><div th:replace="~{dung-chung :: messages}"></div><form th:action="@{/tao-tai-khoan}" th:object="${form}" method="post"><div class="auth-names"><div><label for="ho">Họ</label><input id="ho" th:field="*{ho}" autocomplete="family-name" maxlength="60" required><small class="field-error" th:errors="*{ho}"></small></div><div><label for="ten">Tên</label><input id="ten" th:field="*{ten}" autocomplete="given-name" maxlength="60" required><small class="field-error" th:errors="*{ten}"></small></div></div><label for="ngaySinh">Ngày sinh</label><input id="ngaySinh" th:field="*{ngaySinh}" type="date" autocomplete="bday" required><small class="field-error" th:errors="*{ngaySinh}"></small><label for="taiKhoan">Email</label><input id="taiKhoan" th:field="*{taiKhoan}" type="email" autocomplete="email" maxlength="254" required><small class="field-error" th:errors="*{taiKhoan}"></small><label for="matKhau">Mật khẩu</label><div class="password-field"><input id="matKhau" name="matKhau" type="password" autocomplete="new-password" minlength="12" maxlength="64" aria-describedby="password-help" required><button class="password-toggle" type="button" hidden aria-label="Hiển thị mật khẩu" aria-controls="matKhau" aria-pressed="false" title="Hiển thị mật khẩu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-toggle-slash" d="M4 4l16 16"/></svg></button></div><small id="password-help" aria-live="polite">Mật khẩu cần 12–64 ký tự và không quá 72 byte UTF-8.</small><small class="field-error" th:errors="*{matKhau}"></small><label for="xacNhanMatKhau">Nhập lại mật khẩu</label><div class="password-field"><input id="xacNhanMatKhau" name="xacNhanMatKhau" type="password" autocomplete="new-password" maxlength="64" required><button class="password-toggle" type="button" hidden aria-label="Hiển thị mật khẩu xác nhận" aria-controls="xacNhanMatKhau" aria-pressed="false" title="Hiển thị mật khẩu xác nhận"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-toggle-slash" d="M4 4l16 16"/></svg></button></div><small class="field-error" th:errors="*{xacNhanMatKhau}"></small><button class="btn btn-primary auth-submit">Tạo tài khoản</button></form><a class="google-auth" th:if="${nhaCungCapOAuth.contains('google')}" href="/oauth2/authorization/google">Tạo tài khoản với Google</a><a class="google-auth" th:if="${nhaCungCapOAuth.contains('facebook')}" href="/oauth2/authorization/facebook">Tạo tài khoản với Facebook</a></main><footer th:replace="~{dung-chung :: footer}"></footer><script src="/js/password-help.js" defer></script></body></html>
